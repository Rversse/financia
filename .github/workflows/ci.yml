name: FINANCIA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: financia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Keep package-lock.json synchronized when package.json changes.
      - name: Install dependencies and update lockfile
        run: npm install --no-audit --no-fund

      # Verify that the resulting lockfile supports a clean reproducible install.
      - name: Verify clean dependency install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Commit updated npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock changes."
            exit 0
          fi
          git commit -m "chore: update npm lockfile"
          git push origin HEAD:main
