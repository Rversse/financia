name: Scaffold Supabase Migration

on:
  push:
    branches: [main]
    paths:
      - ".migration-request"
  workflow_dispatch:
    inputs:
      migration_name:
        description: "Snake-case migration name"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: financia-migration-scaffold
  cancel-in-progress: false

jobs:
  scaffold:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 3.0.0

      - name: Initialize Supabase CLI project and create migration
        shell: bash
        env:
          REQUESTED_NAME: ${{ github.event.inputs.migration_name || 'phase2_household_ledger_foundation' }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_NAME" =~ ^[a-z][a-z0-9_]{2,60}$ ]]; then
            echo "Migration name must be snake_case and start with a letter."
            exit 1
          fi
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase migration new "$REQUESTED_NAME"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print

      - name: Commit generated migration scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .migration-request
          git add supabase
          git add -A
          if git diff --cached --quiet; then
            echo "No migration scaffold changes."
            exit 0
          fi
          git commit -m "chore: scaffold Supabase migration"
          git push origin HEAD:main
